<!doctype html>

<head>
<meta charset="utf-8">

<title>B3A · Fu Tai Estate → Shenzhen Bay Port</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC",sans-serif;color:#153c33;background:#f3f5ef;color-scheme:light;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:44px 24px 28px;background:radial-gradient(ellipse at 8% 0%,#dfebd9 0,transparent 45%),radial-gradient(ellipse at 100% 80%,#e5ecdf 0,transparent 45%),#f3f5ef}main{width:min(650px,100%);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:750;letter-spacing:-.02em}.brand-icon{width:32px;height:32px;display:grid;place-items:center;background:#153c33;color:#d6f49c;border-radius:10px}.brand-icon svg{width:19px;height:19px}.city{font-size:11px;color:#738176;letter-spacing:.1em}.journey{background:#fff;border:1px solid #e2e8dd;border-radius:28px;padding:26px 28px;margin-bottom:16px;box-shadow:0 8px 30px #193a2a03}.route-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.badge{display:flex;align-items:center;gap:12px}.route-no{font-size:32px;font-weight:850;letter-spacing:-.06em;line-height:1;background:#d7f39d;border:1px solid #c8e68a;border-radius:13px;padding:9px 14px}.route-kind{font-size:11px;line-height:1.6;color:#6c7f72;letter-spacing:.04em}.route-kind b{display:block;color:#335548;font-size:13px;letter-spacing:0}.direction{white-space:nowrap;flex-shrink:0;font-size:11px;border-radius:99px;padding:7px 11px;border:1px solid #e4e9e0;color:#738176}.stops{display:grid;grid-template-columns:20px 1fr;gap:0 13px}.line{display:flex;flex-direction:column;align-items:center;padding:9px 0}.dot{width:9px;height:9px;border:2px solid #95b081;border-radius:50%;background:#fff;flex-shrink:0}.connector{width:2px;min-height:34px;flex:1;background:linear-gradient(#b9cba9 50%,transparent 50%);background-size:2px 7px;margin:5px 0}.dot.destination{width:11px;height:11px;background:#214d3d;border:3px solid #d7ebc5;box-shadow:0 0 0 1px #214d3d}.stop-from{padding-bottom:23px}.stop-name{font-size:18px;font-weight:650;letter-spacing:.02em}.stop-en{color:#829080;font-size:12px;margin-top:4px}h1{font-size:27px;line-height:1.2;letter-spacing:.01em;margin:0;font-weight:750}.board{background:#fff;border:1px solid #e2e8dd;border-radius:28px;padding:24px;box-shadow:0 12px 36px #163d2e05}.board-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 3px 18px}h2{font-size:14px;font-weight:650;margin:0}.status{font-size:10px;color:#55724c;background:#f0f6e9;padding:6px 9px;border-radius:99px;white-space:nowrap}.bus{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:21px 6px;border-bottom:1px solid #edf0e9;position:relative}.bus:first-child{background:#173f35;color:#eff8e7;border-radius:20px;padding:26px 24px;margin-bottom:6px;border:0;overflow:hidden;min-height:176px}.bus:first-child:after{content:"";position:absolute;right:-33px;top:-63px;width:220px;height:220px;border:1px solid #ffffff09;border-radius:50%;box-shadow:0 0 0 26px #ffffff03,0 0 0 52px #ffffff02;pointer-events:none}.bus strong{font-size:38px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.06em;font-weight:650}.bus:first-child strong{font-size:86px;letter-spacing:-.075em;color:#d8f5a6}.unit{margin-left:10px;font-size:12px;color:#7f8e80}.bus:first-child .unit{color:#b7ccb6;font-size:14px}.label{font-size:10px;letter-spacing:.09em;color:#7f8e80;margin-bottom:9px}.bus:first-child .label{color:#b5caae}.detail{text-align:right;font-size:20px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;z-index:1;max-width:48%}.detail small{display:block;font-size:10px;letter-spacing:.02em;line-height:1.5;margin-top:6px;color:#8a9788}.bus:first-child .detail{font-size:25px}.bus:first-child .detail small{color:#b5caae}.empty{padding:38px 22px;margin:0;line-height:1.8;color:#74816f;background:#f5f7f0;border-radius:18px;font-size:14px}.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 3px 0;font-size:11px;color:#879280}.refresh-info{display:flex;align-items:center;gap:7px}.refresh-dot{width:6px;height:6px;border-radius:50%;background:#a7c07b;box-shadow:0 0 0 3px #f1f6e8}button{border:1px solid #dfe6d8;border-radius:99px;background:#f8faf5;color:#3c5d47;padding:10px 15px;font:inherit;font-weight:650;cursor:pointer;min-height:38px;transition:background .2s,transform .2s}button:hover{background:#edf5df;transform:translateY(-1px)}button:disabled{opacity:.5;cursor:wait;transform:none}button:focus-visible,a:focus-visible{outline:3px solid #95b85c;outline-offset:4px}footer{margin:23px 6px 0;font-size:10px;color:#94a08d;line-height:1.9;text-align:center}footer a{color:#75876a;text-decoration:none;border-bottom:1px solid #cbd7c3}footer a:hover{color:#254c36}.footer-meta{margin-top:9px;font-size:9px;letter-spacing:.03em}.error{color:#9f603e;background:#fff1e5}.footnote{font-size:10px;color:#97a38f;margin:14px 3px 0;line-height:1.6}.loading-bar{height:3px;border-radius:9px;background:#eaf0e2;margin:17px 3px -5px;overflow:hidden}.loading-bar span{display:block;height:100%;width:100%;background:#c3db9b;transform-origin:left;transform:scaleX(var(--progress,1));transition:transform 1s linear}@media(min-width:760px){body{padding-top:60px}.journey{padding:28px 32px}.board{padding:27px}.bus:first-child{padding:30px;min-height:190px}.bus:first-child strong{font-size:96px}}@media(max-width:390px){body{padding:24px 14px}.journey{padding:22px}.board{padding:19px}.bus:first-child{padding:23px 20px}.bus:first-child strong{font-size:76px}.direction{font-size:10px;padding:6px 9px}.route-kind{font-size:10px}.route-no{font-size:29px}.controls{font-size:10px}.city{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<div class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="3" width="14" height="16" rx="4"/><path d="M5 11h14M8 3v8m8-8v8M8 19v2m8-2v2"/><circle cx="8.5" cy="15.5" r=".8"/><circle cx="15.5" cy="15.5" r=".8"/></svg></span>巴士到站 <span style="font-weight:400;color:#819078">/ next bus</span></div><span class="city">HONG KONG</span></div>
<header class="journey">
<div class="route-top"><div class="badge"><span class="route-no">B3A</span><span class="route-kind"><b>城巴 Citybus</b>跨境巴士服務</span></div><span class="direction">往深圳灣 ↗</span></div>
<div class="stops"><div class="line" aria-hidden="true"><span class="dot"></span><span class="connector"></span><span class="dot destination"></span></div><div><div class="stop-from"><div class="stop-name">富泰邨</div><div class="stop-en">Fu Tai Estate · 青山公路</div></div><div><h1>深圳灣口岸</h1><div class="stop-en">Shenzhen Bay Port</div></div></div></div>
</header>
<section class="board" aria-label="即將到站的巴士">
<div class="board-head"><h2>即將到站 <span style="font-weight:400;color:#99a28f;font-size:11px">/ arrivals</span></h2><span id="status" class="status" role="status">連接中…</span></div>
<div id="arrivals" aria-live="polite" aria-atomic="true"><p class="empty">正在載入下一班巴士…</p></div>
<div class="controls"><span class="refresh-info"><span class="refresh-dot" aria-hidden="true"></span><span id="refresh">每 30 秒自動更新</span></span><button id="reload" type="button">重新整理 ↻</button></div>
<div class="loading-bar" aria-hidden="true"><span id="progress"></span></div>
<p class="footnote">顯示巴士到達富泰邨站的預計時間，並非全程車程。</p>
</section>
<footer><div id="updated">香港時間 · 到站時間僅供參考</div><div>資料來源：<a href="https://data.gov.hk/en-data/dataset/ctb-eta-transport-realtime-eta" target="_blank" rel="noopener">城巴開放數據 · DATA.GOV.HK ↗</a></div><div class="footer-meta">富泰邨（青山公路） · 站點 003261</div></footer>
</main>

<script>
'use strict';
const ENDPOINT='https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/003261/B3A';
const INTERVAL=30000;
const arrivals=document.getElementById('arrivals'),status=document.getElementById('status'),reload=document.getElementById('reload'),refreshLabel=document.getElementById('refresh');
const timeFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
let nextRefresh=Date.now()+INTERVAL,busy=false;
function element(tag,text,className){const node=document.createElement(tag);node.textContent=text;if(className)node.className=className;return node;}
function render(rows){
 const now=Date.now();
 const buses=rows.filter(r=>Number.isFinite(Date.parse(r.eta))&&Date.parse(r.eta)>=now-30000).sort((a,b)=>Date.parse(a.eta)-Date.parse(b.eta));
 const unique=buses.filter((r,i)=>buses.findIndex(b=>b.eta===r.eta)===i).slice(0,3);
 arrivals.replaceChildren();
 if(!unique.length){arrivals.append(element('p',rows.find(r=>r.rmk_tc||r.rmk_en)?.rmk_tc||rows.find(r=>r.rmk_en)?.rmk_en||'暫無到站預報，請稍後再查看。','empty'));return;}
 unique.forEach((bus,index)=>{
  const row=element('div','','bus'),left=element('div',''),value=element('div','');
  left.append(element('div',index===0?'下一班 · NEXT BUS':`第 ${index+1} 班 · FOLLOWING`,'label'));
  value.append(element('strong',String(Math.max(0,Math.ceil((Date.parse(bus.eta)-now)/60000)))),element('span','分鐘 min','unit'));
  left.append(value);
  const detail=element('div',timeFormat.format(new Date(bus.eta)).slice(0,5),'detail');
  detail.append(element('small',bus.rmk_tc||bus.rmk_en||'預計到站'));
  row.append(left,detail);arrivals.append(row);
 });
}
async function refresh(){
 if(busy)return;busy=true;reload.disabled=true;status.textContent='更新中…';status.className='status';
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
 try{
  const response=await fetch(ENDPOINT,{signal:controller.signal,cache:'no-store'});
  if(!response.ok)throw new Error(`HTTP ${response.status}`);
  const payload=await response.json();
  if(!Array.isArray(payload.data))throw new Error('Invalid response');
  const rows=payload.data.filter(r=>r.route==='B3A'&&r.dir==='O'&&r.stop==='003261'&&Number(r.seq)===14);
  const stamp=Date.parse(payload.generated_timestamp);
  const timestamps=rows.map(r=>Date.parse(r.data_timestamp)).filter(Number.isFinite);
  const sourceStamp=timestamps.length?Math.min(...timestamps):stamp;
  if(!Number.isFinite(stamp)||Date.now()-stamp>180000||(Number.isFinite(sourceStamp)&&Date.now()-sourceStamp>180000))throw new Error('Stale data');
  render(rows);status.textContent='● 即時預報';
  document.getElementById('updated').textContent=`最後更新 ${timeFormat.format(new Date())} HKT · 到站時間僅供參考`;
 }catch(error){
  status.textContent='暫時無法連線';status.className='status error';
  arrivals.replaceChildren(element('p','暫時無法取得最新到站時間，請檢查網絡或稍後再試。系統會繼續自動更新。','empty'));
 }finally{clearTimeout(timeout);busy=false;reload.disabled=false;nextRefresh=Date.now()+INTERVAL;}
}
reload.addEventListener('click',refresh);
setInterval(()=>{if(!busy&&Date.now()>=nextRefresh)refresh();refreshLabel.textContent=busy?'正在取得最新預報…':`${Math.max(0,Math.ceil((nextRefresh-Date.now())/1000))} 秒後自動更新`;document.getElementById('progress').style.setProperty('--progress',Math.max(0,Math.min(1,(nextRefresh-Date.now())/INTERVAL))); },1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
refresh();
</script>
</body>
</html>
